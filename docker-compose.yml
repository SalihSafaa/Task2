services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  migrator:
    build:
      context: .
      target: migrator
    command:
      - "--connection"
      - "Server=db;Database=ProductCatalogDb;User Id=sa;Password=${DB_PASSWORD:?DB_PASSWORD is required};TrustServerCertificate=True"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  dbsetup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      APP_DB_PASSWORD: "${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}"
    volumes:
      - ./db/init-app-login.sql:/init-app-login.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$DB_PASSWORD" -C -b -v APP_DB_PASSWORD="$$APP_DB_PASSWORD" -i /init-app-login.sql
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      target: final
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__DefaultConnection: "Server=db;Database=ProductCatalogDb;User Id=catalog_app;Password=${APP_DB_PASSWORD:?APP_DB_PASSWORD is required};TrustServerCertificate=True"
      Jwt__Key: "${JWT_KEY:?JWT_KEY is required}"
      Seed__AdminUsername: "${ADMIN_SEED_USERNAME:?ADMIN_SEED_USERNAME is required}"
      Seed__AdminPassword: "${ADMIN_SEED_PASSWORD:?ADMIN_SEED_PASSWORD is required}"
    depends_on:
      dbsetup:
        condition: service_completed_successfully

volumes:
  sql_data:
